<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground 검사</title>
<style>
:root { color-scheme: light dark; --bg: #f6f7f3; --fg: #152024; --muted: #5a6964; --ok: #1f8a57; --bad: #c9372c; --line: #cfd6d0; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1113; --fg: #e4e9e6; --muted: #8b9893; --ok: #4cc38a; --bad: #ef5b5b; --line: #29333a; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 system-ui, "IBM Plex Sans KR", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 22px; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 14px; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.ok { color: var(--ok); font-weight: 600; } td.bad { color: var(--bad); font-weight: 600; }
#summary { font: 600 15px ui-monospace, monospace; margin: 14px 0; }
</style>
</head>
<body>
<main>
  <h1>Playground 검사</h1>
  <p>Playground 코어(js/)가 저장소 결과와 같은 방향으로 도는지, 주소 하나로 같은 주행이 다시 나오는지, 화면이 로봇이 본 지형을 그리는지 확인한다.
    각 줄은 한 번의 주행이나 한 번의 확인이고, 기대와 다르면 빨갛게 표시한다. 시연의 기대는 <code>js/presets.js</code>의 <code>expect</code>를 읽는다.
    <code>scripts/check_playground.sh</code>가 이 페이지를 헤드리스 Chrome으로 열어 판정한다. 약 4분 걸린다.</p>
  <div id="summary">실행 중…</div>
  <div class="table"><table>
    <thead><tr><th>검사</th><th>설정</th><th>기대</th><th>결과</th><th>시뮬 시간</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script type="module">
import { World, defaultOptions } from "./js/sim.js";
import { PRESETS, GROUPS } from "./js/presets.js";
import { PUBLIC_BASE, baseState, buildWorld, canon, parse, serialize } from "./js/state.js";
import { EXAG, drawHeights, meshCells, meshZ, robotPose, attitudeNow } from "./js/view.js";
import { loadPlannerD, egocentricCrop, goalBody, condition, velocityFn } from "./js/plannerd.js";

const rows = document.getElementById("rows");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tick = () => new Promise((r) => setTimeout(r, 0));   // 화면이 한 줄씩 갱신되게
let pass = 0, total = 0;
function row(name, cfg, expect, got, ok, t = "") {
  total++; if (ok) pass++;
  const td = (v, cls = "") => `<td${cls}>${esc(v)}</td>`;   // check_playground.sh가 표 줄(tr 뒤 td)만 찍도록 이 줄에는 그 꼴을 쓰지 않는다
  rows.insertAdjacentHTML("beforeend", "<tr>" + td(name) + td(cfg) + td(expect) + td(got, ` class="${ok ? "ok" : "bad"}"`) + td(t) + "</tr>");
}
const runToEnd = (w) => { while (w.status === "running") w.step(); return { status: w.status, fail: w.failCode || "", t: w.t, k: w.k, pose: w.pose.slice() }; };
const word = (r) => (r.status === "reached" ? "도달" : r.fail === "lethal" ? "치명 셀 진입" : r.fail === "timeout" ? "시간 초과" : r.fail === "tipover" ? "전복 한계 초과" : r.fail === "collision" ? "보행자 충돌" : r.status);
const describe = (o) => `${o.robot !== "swerve" ? o.robot + (o.poseComp ? "" : " 보상 끔") + " · " : ""}${o.scenario}${o.level ? "@L" + o.level : ""} s${o.seed} · ${o.perception}`
  + `${o.perception === "occlusion" ? ` ${o.sensorHeight} m${o.shadowCeiling ? " +상한" : ""}${o.shadowCeiling && o.depthPrior ? " +prior" : ""}` : ""} · ${o.planner}+${o.controller}`;

// 0) Planner D(TP-0137): 가중치를 먼저 불러온다(시연이 Planner D를 쓴다). 그리고 파이썬이 같은 float16 가중치로 낸 값
//    (plannerd_golden.json, scripts/export_playground_planner_d.py)을 정수 공식으로 만든 같은 지도에서 다시 낸다.
const pdNet = await loadPlannerD();
{
  const g = await (await fetch("./plannerd_golden.json")).json(), { W, H, res } = g.map, N = W * H, mk = () => new Float32Array(N);
  const map = { grid: { res, W, H, N }, cost: mk(), sigma: mk(), slope: mk(), step: mk() };
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const i = r * W + c;
    map.cost[i] = ((r * 7 + c * 13) % 97) / 96; map.sigma[i] = ((r * 5 + c * 11) % 71) / 70 > 0.8 ? 1 : 0;
    map.slope[i] = (((r * 3 + c * 5) % 53) / 52) * 0.4; map.step[i] = (((r * 11 + c * 2) % 61) / 60) * 0.12;
  }
  let worst = 0;
  g.cases.forEach((cs, k) => {
    const crop = egocentricCrop(map, cs.pose, 64, 0.1);
    for (let ch = 0; ch < 4; ch++) { let sm = 0; for (let i = 0; i < 4096; i++) sm += crop[ch * 4096 + i]; worst = Math.max(worst, Math.abs(sm - cs.crop_sum[ch]) / Math.max(1, Math.abs(cs.crop_sum[ch]))); }
    for (const [ch, r, c, v] of cs.crop_px) worst = Math.max(worst, Math.abs(crop[(ch * 64 + r) * 64 + c] - v));
    const cond = condition(pdNet, crop, goalBody(cs.pose, cs.goal, 3.0), cs.twist.map((v, i) => v / [1.5, 0.6, 1.2][i]));
    cs.cond.forEach((v, i) => { worst = Math.max(worst, Math.abs(cond[i] - v)); });
    const vel = velocityFn(pdNet, cond);
    for (const { t, v } of cs.velocity) {
      const y = vel(Float32Array.from({ length: pdNet.D }, (_, i) => Math.sin(0.37 * i + 1.3 * k)), t);
      v.forEach((u, i) => { worst = Math.max(worst, Math.abs(y[i] - u)); });
    }
  });
  row("Planner D 황금 벡터", `${g.ckpt} · ${g.cases.length}경우 · crop·조건 320·속도 120×${g.t.length}`, "파이썬과 차 1e-4 이하", `최대 차 ${worst.toExponential(1)}`, worst < 1e-4);
}

// 1) 시연이 아닌 주행. 기대값은 docs/playground/README.md 6절과 같다. 한 줄 = 한 주행.
const CASES = [
  ["기본 주행", { scenario: "curb_ramp", perception: "occlusion" }, "reached"],
  ["기본 주행", { scenario: "bumps_potholes", perception: "occlusion" }, "reached"],
  ["기본 주행", { scenario: "slope_crossfall", perception: "range" }, "reached"],
  ["기본 주행", { scenario: "random_mix", perception: "range" }, "reached"],
  ["L1 간이 주행", { scenario: "curb_ramp", perception: "l1lite" }, "reached"],
  ["L1 간이 주행", { scenario: "bumps_potholes", perception: "l1lite" }, "reached"],
  ["Planner D flow 주행", { scenario: "bumps_potholes", perception: "occlusion", planner: "plannerd" }, "reached"],
  ["Planner D diffusion 주행", { scenario: "curb_ramp", perception: "occlusion", planner: "plannerd_diff" }, "reached"],
];
for (const [name, set, expect] of CASES) {
  await tick();
  const o = Object.assign(defaultOptions(), set), r = runToEnd(new World(o));
  row(name, describe(o), expect === "reached" ? "도달" : "실패", word(r), r.status === expect, `${r.t.toFixed(1)} s`);
}

// 2) 시연 31개: 주소 #id로 연 것과 같은 World(state.js buildWorld). 기대는 PRESETS.expect의 status·fail이다.
const fieldsOk = PRESETS.every((p) => GROUPS[p.group] && p.watch && p.expect?.text && p.repo && (p.pair === null || (p.pair && parse(p.pair).notes.length === 0)));
row("시연 필드", `${PRESETS.length}개`, "group·watch·expect·repo, pair는 쓸 수 있는 주소", fieldsOk ? "있다" : "빠졌다", fieldsOk);
for (const p of PRESETS) {
  await tick();
  const st = baseState(p.id), r = runToEnd(buildWorld(st)), e = p.expect;
  const ok = r.status === e.status && (e.status !== "failed" || !e.fail || r.fail === e.fail);
  row(`시연 ${p.id}`, describe(st.o) + (p.peds ? ` · 보행자 ${p.peds}명` : ""), e.text, word(r), ok, `${r.t.toFixed(1)} s`);
}

// 3) 주소 왕복: parse(serialize(x))가 x와 같다(시연 20개, 사용자 설정 3개, 시연 덮어쓰기 3개).
function user(set, extra = {}) { const s = baseState(null); Object.assign(s.o, set); return Object.assign(s, extra); }
const USERS = [
  ["사용자 설정 1", user({ scenario: "bumps_potholes", seed: 4, perception: "occlusion" })],
  ["사용자 설정 2", (() => {
    const s = user({ scenario: "random_mix", level: 2, seed: 7, robot: "quadruped", perception: "l1lite", sensorHeight: 0.45, stereo: true, unknownNear: 1, poseNoise: 0.5 },
      { goal: [9, 5.5], peds: [[8, 1, 0, 0.6], [10.25, 7.5, -0.31, -0.2]], edits: [["box", 6, 4], ["pothole", 9.5, 2.25], ["erase", 6.1, 4.05]], layer: "elev_err", view: "2d" });
    Object.assign(s.o.mppi, { K: 512, T: 30, lambda: 0.3, noise: [0.4 * 1.5, 0.25 * 1.5, 0.6 * 1.5] }); Object.assign(s.o.mppi.w, { trav: 8, risk: 2, attitude: 25 });
    return s;
  })()],
  ["사용자 설정 3", user({ scenario: "curb_ramp", level: 1, seed: 3, perception: "range", sensorRange: 6.5, planner: "straight", controller: "tracker", shadowCeiling: false }, { goal: [14, 6.5], layer: "gt", geo: "true", ex: 1 })],
];
const OVERRIDES = [
  ["시연 + 보기", Object.assign(baseState("TP-0047"), { layer: "belief_elev", view: "2d", geo: "both", ex: 3 })],
  ["시연 + seed(보행자 따라감)", (() => { const s = baseState("TP-0027"); s.o.seed = 2; return s; })()],
  ["시연 + 센서 높이·K", (() => { const s = baseState("TP-0031-low"); s.o.sensorHeight = 0.5; s.o.mppi.K = 320; return s; })()],
];
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
for (const [name, x] of [...PRESETS.map((p) => [p.id, baseState(p.id)]), ...USERS, ...OVERRIDES]) {
  const h = serialize(x), y = parse(h), ok = same(canon(x), y.state) && !y.notes.length;
  row(`주소 왕복: ${name}`, `#${h}`, "parse(serialize(x)) = x", ok ? "같다" : "다르다 " + y.notes.join(" "), ok);
}
// 나쁜 주소: 예외 없이 읽고, 쓸 수 없는 값은 바탕(기본 설정) 그대로 두고 알린다. 상속 이름(constructor)과 상한을 넘는 목록도 본다.
// 없는 시연은 "#TP-" + "9999"로 나눠 쓴다. 붙여 쓰면 진행 원장 점검(tp_registry.py check)이 문서의 TP 번호로 읽는다.
const BAD = ["#pg?layer=constructor", "#pg?layer=__proto__", "#pg?ed=constructor,1,1", "#pg?ed=b,99,1", "#pg?goal=100,100", "#pg?ped=0,0,9,9",
  "#pg?s=abc", "#pg?v=4d", "#TP-" + "9999", "#%E0%A4%A", "#pg?ped=" + Array(101).fill("1,1,0,0").join(";"), "#pg?geo=constructor", "#pg?ex=5", "#pg?ex="];
const badWrong = BAD.filter((h) => {
  try { const r = parse(h); return !(r.notes.length && same(r.state, canon(baseState(null)))); } catch { return true; }
});
row("나쁜 주소", `${BAD.length}개(상속 이름, 범위 밖, 상한을 넘는 목록)`, "예외 없이 기본 설정 + 알림", badWrong.length ? "다르다: " + badWrong.join(" ").slice(0, 120) : "같다", !badWrong.length);

// 4) 새 탭 재현: 주소로 index.html을 iframe(새 문서)에 열고 끝까지 달린 결과·끝 시각·마지막 자세가 이 페이지의 결과와 같다.
//    보기는 2D로 둔다(결과와 무관하고 three.js를 받지 않는다).
async function inTab(hash) {
  const f = document.createElement("iframe");
  f.style.cssText = "position:absolute;left:-10000px;top:0;width:960px;height:720px;border:0";
  f.src = "index.html#" + hash;
  const loaded = new Promise((ok) => f.addEventListener("load", ok, { once: true }));
  document.body.appendChild(f);
  await loaded;
  for (let i = 0; i < 200 && !f.contentWindow.playgroundTest; i++) await new Promise((r) => setTimeout(r, 50));
  const t = f.contentWindow.playgroundTest, r = t.runToEnd(), link = t.link(), back = t.hash();
  f.remove();
  return { r, link, back };
}
const fmt = (r) => `${word(r)} ${r.t.toFixed(1)} s (${r.pose.map((v) => v.toFixed(3)).join(", ")})`;
for (const [name, x0] of [...USERS, OVERRIDES[1], OVERRIDES[2]]) {
  await tick();
  const x = { ...canon(x0), view: "2d" }, h = serialize(x);
  const mine = runToEnd(buildWorld(x)), tab = await inTab(h);
  const ok = mine.status === tab.r.status && mine.fail === tab.r.fail && mine.t === tab.r.t && mine.pose.every((v, i) => v === tab.r.pose[i]) && tab.back === h;
  row(`새 탭 재현: ${name}`, `#${h}`, fmt(mine), ok ? "같다" : `다르다: ${fmt(tab.r)} · 주소 ${tab.back}`, ok, `${mine.t.toFixed(1)} s`);
  if (name === "사용자 설정 1") row("iframe 안의 링크 바탕", tab.link, PUBLIC_BASE, tab.link.startsWith(PUBLIC_BASE + "#") ? "공개 주소" : "다르다", tab.link.startsWith(PUBLIC_BASE + "#"));
}

// 5) 로봇이 본 지형 보기(TP-0106). 2D 음영과 3D 메시는 view.js drawHeights의 fill을 그린다(render2d.js, render3d.js).
{
  await tick();
  const w = buildWorld(baseState("TP-0047")), b = w.belief, g = w.terrain.grid, z = w.terrain.z, H = drawHeights("belief", w);
  let unseen = 0, bad = 0, hidden = 0;
  for (let i = 0; i < g.N; i++) if (!b.known[i]) { unseen++; if (H.fill[i] !== b.elev[i]) bad++; if (Math.abs(b.elev[i] - z[i]) > 0.05) hidden++; }
  row("로봇이 본 지형: 못 본 칸", `TP-0047 시작 · 못 본 칸 ${unseen}`, "그릴 높이 = belief.elev(못 본 칸 모두)",
    bad ? `다른 칸 ${bad}` : `같다 · 그중 참 높이와 5 cm 넘게 다른 칸 ${hidden}`, unseen > 0 && !bad && hidden > 0);
  // 3D 메시 정점(2칸마다 1정점)의 높이 = 그릴 높이 × 과장
  const { cells } = meshCells(g, 2);
  let mv = 0, mbad = 0;
  for (const ex of EXAG) {
    const mz = meshZ(H.fill, cells, ex);
    for (let v = 0; v < cells.length; v++) if (!b.known[cells[v]]) { mv++; if (Math.abs(mz[v] - b.elev[cells[v]] * ex) > 1e-6) mbad++; }
  }
  row("로봇이 본 지형: 3D 메시", `못 본 정점 ${mv / EXAG.length} × 과장 ${EXAG.join("·")}`, "정점 높이 = belief.elev × 과장", mbad ? `다른 정점 ${mbad}` : "같다", mv > 0 && !mbad);
  const T = drawHeights("true", w), B = drawHeights("both", w);
  const wg = buildWorld(Object.assign(baseState("TP-0047"), { o: Object.assign(baseState("TP-0047").o, { perception: "gt" }) }));
  const okModes = T.fill === z && !T.line && B.fill === b.elev && B.line === z && drawHeights("belief", wg).fill.every((v, i) => v === wg.terrain.z[i]);
  row("그릴 높이 셋", "참 · 둘 다 · 완전 관측의 로봇이 본 지형", "참 = 참 높이, 둘 다 = 로봇이 본 면 + 참 선, 완전 관측이면 참과 같다", okModes ? "같다" : "다르다", okModes);
}
// 3D 로봇 자세: 과장 ×1·×2·×3에서 render3d.js와 같은 회전 Rz(yaw)·Ry(−pitch)·Rx(roll)을 짜서 다시 읽은 pitch·roll이
// 텔레메트리 값(attitudeNow) + 걸음새 흔들림과 0.5° 안이다. 옛 방식(과장한 높이차로 기울이기)의 차도 함께 적는다.
{
  const mul = (A, B) => A.map((r) => [0, 1, 2].map((j) => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
  const Rz = (a) => [[Math.cos(a), -Math.sin(a), 0], [Math.sin(a), Math.cos(a), 0], [0, 0, 1]];
  const Ry = (a) => [[Math.cos(a), 0, Math.sin(a)], [0, 1, 0], [-Math.sin(a), 0, Math.cos(a)]];
  const Rx = (a) => [[1, 0, 0], [0, Math.cos(a), -Math.sin(a)], [0, Math.sin(a), Math.cos(a)]];
  const deg = (r) => (r * 180) / Math.PI;
  const slope = Object.assign(baseState(null), { o: Object.assign(defaultOptions(), { scenario: "slope_crossfall", level: 3, perception: "range" }) });
  for (const [name, st] of [["TP-0047", baseState("TP-0047")], ["slope_crossfall L3 s0", slope], ["TP-0102 사족", baseState("TP-0102")]]) {
    await tick();
    const w = buildWorld(st);
    let worst = 0, big = 0, old = 0, gaitMax = 0;
    for (let k = 0; k <= 100 && w.status === "running"; k++) {
      if (k) w.step();
      const a = attitudeNow(w), H = drawHeights("belief", w);
      big = Math.max(big, Math.abs(a.pitch), Math.abs(a.roll));
      for (const ex of EXAG) {
        const P = robotPose(w, H.fill, ex), M = mul(mul(Rz(P.yaw), Ry(-P.pitch)), Rx(P.roll));
        const p = Math.asin(M[2][0]), r = Math.atan2(M[2][1], M[2][2]);
        worst = Math.max(worst, Math.abs(deg(p - P.gait.pitch - a.pitch)), Math.abs(deg(r - P.gait.roll - a.roll)));
        gaitMax = Math.max(gaitMax, Math.abs(deg(P.gait.pitch)), Math.abs(deg(P.gait.roll)));
        if (ex !== 3) continue;
        // 옛 방식: 과장한 참 높이의 앞뒤(±0.3 m)·좌우(±0.2 m) 차로 기울였다(×3에서 잰다)
        const [x, y, yaw] = w.pose, c = Math.cos(yaw), sn = Math.sin(yaw), zt = (dx, dy) => w.terrain.grid.sample(w.terrain.z, x + dx, y + dy, 0) * ex;
        old = Math.max(old, Math.abs(deg(Math.atan2(zt(0.3 * c, 0.3 * sn) - zt(-0.3 * c, -0.3 * sn), 0.6) - a.pitch)), Math.abs(deg(Math.atan2(zt(-0.2 * sn, 0.2 * c) - zt(0.2 * sn, -0.2 * c), 0.4) - a.roll)));
      }
    }
    row(`3D 로봇 자세: ${name}`, `100스텝 · 과장 ${EXAG.join("·")} · 텔레메트리 최대 ${deg(big).toFixed(1)}°${gaitMax ? ` · 흔들림 최대 ${gaitMax.toFixed(1)}°` : ""}`,
      "pitch·roll − 흔들림 = 텔레메트리(차 0.5° 이하)", `최대 차 ${worst.toFixed(3)}° (옛 방식 ×3이면 ${old.toFixed(1)}°)`, worst <= 0.5 && big > Math.PI / 180);
  }
}
const s = document.getElementById("summary");
s.textContent = `${pass === total ? "PASS" : "FAIL"} ${pass}/${total}`;
s.style.color = pass === total ? "var(--ok)" : "var(--bad)";
document.body.dataset.result = s.textContent;   // scripts/check_playground.sh가 읽는다
</script>
</body>
</html>
