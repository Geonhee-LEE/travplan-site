<!doctype html><meta charset="utf-8"><title>MPOT 비교</title>
<!-- TP-0136 그림(docs/assets/figs/tp0136_mpot.webp)을 만드는 페이지. 헤드리스 Chrome --screenshot으로 찍는다. -->
<style>body{margin:0;background:#0d1113;color:#e4e9e6;font:14px system-ui,sans-serif}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px}canvas{width:100%;height:330px;display:block}h3{margin:4px 0;font-size:14px}</style>
<div class="g" id="g"></div>
<script type="module">
import { World, defaultOptions } from "./js/sim.js";
import { Map2D } from "./js/render2d.js";
const css={line:"#29333a",muted:"#8b9893",fg:"#e4e9e6",accent:"#f2b705",route:"#3fb6a8",ok:"#4cc38a",bad:"#ef5b5b",mapBg:"#0d1113"};
const view={layer:"belief",geo:"belief",exag:2,route:true,samples:false,points:false,mode:"2d",cursor:null,drag:null};
const panels=[["MPOT · 연석 레벨 2 seed 1 · 첫 계획(입자 16개)",{planner:"mpot",scenario:"curb_ramp",level:2,seed:1},0],
              ["MPOT · 레벨 3 seed 0 · 연석 앞 국소 최솟값",{planner:"mpot",scenario:"curb_ramp",level:3,seed:0},20],
              ["Guidance(Dijkstra) · 레벨 3 seed 0 · 경사로를 찾는다",{planner:"guidance",scenario:"curb_ramp",level:3,seed:0},20]];
for (const [title,set,T] of panels) {
  const w=new World(Object.assign(defaultOptions(),{perception:"range"},set));
  while(w.status==="running"&&w.t<T) w.step();
  const d=document.createElement("div"),h=document.createElement("h3"),cv=document.createElement("canvas");
  h.textContent=`${title} · t=${w.t.toFixed(1)} s`; d.append(h,cv); document.getElementById("g").append(d);
  new Map2D(cv).draw(w,view,css);
}
document.body.dataset.done=1;
</script>
